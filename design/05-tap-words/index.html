<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hopscotch - Tap Words</title>
<!-- Fonts -->

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            "secondary": "#6251a7",

            "surface-container-low": "#fff0f3",
            "on-surface-variant": "#584049",

            "error-container": "#ffdad6",
            "cat-rhymes-bg": "#DDF5EA",
            "on-primary": "#ffffff",
            "cat-stories-text": "#8A3F00",

            "surface-container-highest": "#f6dce4",

          "borderRadius": {
            "DEFAULT": "1rem",

          "spacing": {

            "space-2xl": "2rem",

          "fontFamily": {

          "fontSize": {

            "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
            "body": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "reading-child": ["28px", { "lineHeight": "1.4", "fontWeight": "400" }]

          "boxShadow": {

            "active-glow": "0 0 0 4px #FEE3F3, 0 0 16px rgba(202,4,126,0.25)"

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    @keyframes pulse-gentle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .animate-pulse-subtle {
      animation: pulse-gentle 2s infinite ease-in-out;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-text-primary antialiased flex justify-center selection:bg-accent-tint selection:text-accent-tint-text">
<!-- Mobile Viewport Frame (393px × 852px typical iPhone) -->
<main class="w-full max-w-[393px] min-h-screen flex flex-col bg-background relative overflow-x-hidden pb-[34px]">
<!-- Shared TopAppBar Component strictly structured -->
<header class="w-full pt-12 pb-2 px-5 flex flex-col bg-background">
<!-- Nav Cluster & Step Indicator -->
<div class="flex justify-between items-center w-full px-0 py-2 border-b border-border-hairline">
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-accent-tint active:scale-95 transition-transform duration-150 text-text-primary" type="button">
<span class="material-symbols-outlined text-2xl" data-icon="close">close</span>
</button>
<h1 class="text-text-primary font-title-lg text-title-lg tracking-tight">Step 2 of 4</h1>
<button aria-label="Help" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-accent-tint active:scale-95 transition-transform duration-150 text-text-primary" type="button">
<span class="material-symbols-outlined text-2xl" data-icon="help_outline">help_outline</span>
</button>
</div>
<!-- Linear Step Progress Bar -->
<div class="w-full h-1.5 bg-border-hairline rounded-full mt-3 overflow-hidden">
<div class="h-full bg-primary-container rounded-full transition-all duration-300" style="width: 50%;"></div>
</div>
</header>
<!-- Content Canvas -->
<div class="flex-1 px-5 pt-3 pb-4 flex flex-col gap-4">
<!-- Category Pill & Title Block -->
<div class="flex flex-col gap-1.5 items-start">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-accent-tint text-accent-tint-text font-caption text-caption shadow-sm">
<span class="material-symbols-outlined text-base" data-icon="graphic_eq" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
<span>Sounds</span>
</div>
<h2 class="font-headline-hero text-[26px] leading-[32px] text-text-primary">
          Tap a pink word to hear it
        </h2>
</div>
<!-- Main Decodable Sentence Card -->
<section class="bg-surface rounded-lg p-6 shadow-card-soft border border-border-hairline/60">
<p class="font-reading-child text-[30px] leading-[1.6] text-text-primary tracking-wide">
          The 
          <!-- Active Highlighted Word 'cat' -->
<button class="inline-flex items-center gap-1.5 px-3 py-1 mx-1 rounded-full bg-accent-tint text-accent-tint-text font-bold shadow-active-glow ring-2 ring-primary-container align-middle transform transition-transform active:scale-95 animate-pulse-subtle" type="button">
<span>cat</span>
<span class="material-symbols-outlined text-[20px] text-primary-container" data-icon="volume_up" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<!-- Tappable Word 'sat' -->
<button class="inline-flex items-center gap-1 px-3 py-1 mx-1 rounded-full bg-accent-tint text-accent-tint-text font-bold align-middle hover:bg-surface-alt active:scale-95 transition-transform" type="button">
<span>sat</span>
<span class="material-symbols-outlined text-[18px] opacity-80" data-icon="volume_up">volume_up</span>
</button>
          on a 
          <!-- Tappable Word 'mat' -->
<button class="inline-flex items-center gap-1 px-3 py-1 mx-1 rounded-full bg-accent-tint text-accent-tint-text font-bold align-middle hover:bg-surface-alt active:scale-95 transition-transform" type="button">
<span>mat</span>
<span class="material-symbols-outlined text-[18px] opacity-80" data-icon="volume_up">volume_up</span>
</button>.
        </p>
</section>
<!-- Sound Breakdown Row for active word 'cat' -->
<section class="flex flex-col gap-2.5">
<div class="flex items-center justify-between px-1">
<div class="flex items-center gap-2">
<span class="font-label text-label font-bold text-text-secondary">Break it down:</span>
<span class="px-2 py-0.5 rounded-full bg-surface-alt text-cat-sounds-text font-caption text-caption">Phonemes</span>
</div>
<span class="text-xs text-text-tertiary font-label flex items-center gap-1">
<span class="material-symbols-outlined text-sm" data-icon="touch_app">touch_app</span>
            Tap letter
          </span>
</div>
<div class="grid grid-cols-3 gap-3">
<!-- Phoneme 1: [ c ] -->
<button class="flex flex-col items-center justify-center h-20 bg-surface rounded-DEFAULT border-2 border-border-hairline shadow-sm hover:border-border-control active:scale-95 transition-all" type="button">
<span class="font-reading-child text-[28px] font-bold text-text-primary">c</span>
<span class="material-symbols-outlined text-sm text-text-tertiary mt-0.5" data-icon="volume_mute">volume_mute</span>
</button>
<!-- Phoneme 2: [ a ] (ACTIVE Playing State) -->
<button class="flex flex-col items-center justify-center h-20 bg-accent-tint rounded-DEFAULT border-2 border-primary-container shadow-active-glow ring-2 ring-primary-container/20 active:scale-95 transition-all relative overflow-hidden" type="button">
<div class="absolute top-1 right-1.5 flex space-x-0.5">
<span class="w-1.5 h-1.5 bg-primary-container rounded-full animate-ping"></span>
</div>
<span class="font-reading-child text-[28px] font-extrabold text-accent-tint-text">a</span>
<span class="material-symbols-outlined text-base text-primary-container mt-0.5" data-icon="volume_up" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<!-- Phoneme 3: [ t ] -->
<button class="flex flex-col items-center justify-center h-20 bg-surface rounded-DEFAULT border-2 border-border-hairline shadow-sm hover:border-border-control active:scale-95 transition-all" type="button">
<span class="font-reading-child text-[28px] font-bold text-text-primary">t</span>
<span class="material-symbols-outlined text-sm text-text-tertiary mt-0.5" data-icon="volume_mute">volume_mute</span>
</button>
</div>
</section>
<!-- Parent Coaching Prompt Card -->
<section class="bg-support-tint rounded-lg p-4 border border-support-strong/20 shadow-sm flex items-start gap-3 mt-1">
<div class="w-9 h-9 rounded-full bg-white flex items-center justify-center flex-shrink-0 text-support-tint-text shadow-sm mt-0.5">
<span class="material-symbols-outlined text-xl" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-caption text-caption text-support-tint-text font-bold tracking-wider uppercase">
            Parent Tip
          </span>
<p class="font-body text-[14px] leading-5 text-text-primary font-medium">
            Point to each letter as you say it. Ask: <span class="italic font-bold text-support-tint-text">"What sound does ‘a’ make?"</span>
</p>
</div>
</section>
<!-- Secondary Action: Hear full sentence -->
<div class="mt-auto pt-2 flex flex-col gap-3">
<button class="w-full h-12 rounded-full bg-surface border-2 border-border-control flex items-center justify-center gap-2 text-text-primary font-label text-label hover:bg-surface-alt active:scale-[0.98] transition-all shadow-sm" type="button">
<span class="material-symbols-outlined text-primary-container text-xl" data-icon="play_circle" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span>Hear the whole sentence</span>
</button>
<!-- Primary CTA: Next Button -->
<button class="w-full h-14 rounded-full bg-primary-container text-white flex items-center justify-center gap-2 font-title-lg text-title-lg shadow-md hover:bg-accent-pressed active:scale-[0.98] transition-all" type="button">
<span>Next</span>
<span class="material-symbols-outlined text-2xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
