<!-- Interactive Audio Feedback Micro-Script -->
<script>
    function triggerWordSound(button) {
      button.classList.add('ring-2', 'ring-primary-container', 'scale-105');
      setTimeout(() => {
        button.classList.remove('ring-2', 'ring-primary-container', 'scale-105');
      }, 300);
    }

    let isPlaying = false;
    function toggleSpeech(button) {
      isPlaying = !isPlaying;
      const icon = button.querySelector('.material-symbols-outlined');
      if (isPlaying) {
        button.classList.add('bg-accent-tint', 'text-primary', 'border-primary');
        icon.innerText = 'pause';
      } else {
        button.classList.remove('bg-accent-tint', 'text-primary', 'border-primary');
        icon.innerText = 'volume_up';
      }
    }
  </script>
